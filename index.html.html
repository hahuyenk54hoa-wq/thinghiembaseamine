  <nav class="nav-controls" aria-label="Điều hướng"><button class="nav-btn" data-global="home">⌂ Thí nghiệm</button><button class="nav-btn nav-highlight" data-global="summary">▤ Bảng điểm</button><button class="nav-btn" id="soundButton" data-global="sound">♫ Bật âm thanh</button><button class="nav-btn" data-global="fullscreen">⛶ Toàn màn hình</button></nav>
</div></header>
<main id="app"></main><div class="notice-toast" id="toast" role="status" aria-live="polite"></div><div class="drawer-shade" id="shade" data-close-drawer></div>
<script>
(()=>{'use strict';
const CHEMS=[
{id:'amine',name:'Methylamine',label:'CH₃NH₂',detail:'0,1 M · Không màu',shade:'#e6f8fb',paper:false},
{id:'hcl',name:'Hydrochloric acid',label:'HCl',detail:'0,1 M · Không màu',shade:'#e6f6fc',paper:false},
{id:'fe',name:'Iron(III) chloride',label:'FeCl₃',detail:'0,1 M · Màu vàng',shade:'#eeba40',paper:false},
{id:'cu',name:'Copper(II) sulfate',label:'CuSO₄',detail:'0,1 M · Xanh lam nhạt',shade:'#8dcfe8',paper:false},
{id:'phenol',name:'Phenolphthalein',label:'Chỉ thị',detail:'Dung dịch không màu',shade:'#f5f9fc',paper:false},
{id:'ph',name:'Giấy pH',label:'Giấy pH',detail:'Giấy chỉ thị',shade:'#f4c660',paper:true},
{id:'litmus',name:'Giấy quỳ tím',label:'Quỳ tím',detail:'Giấy chỉ thị',shade:'#997ac9',paper:true}
];
const LABS=[
{id:1,short:'Chất chỉ thị',title:'Phản ứng với chất chỉ thị',objective:'Nhận biết tính base của dung dịch methylamine.',mission:'Chọn giấy chỉ thị và kiểm tra dung dịch CH₃NH₂.',steps:[{name:'Chọn giấy chỉ thị',detail:'Giấy quỳ tím hoặc giấy pH',needs:['litmus','ph'],button:'Đặt giấy lên mặt kính',act:'paper'},{name:'Thêm methylamine',detail:'Nhỏ một giọt lên giấy',needs:['amine'],button:'Nhỏ 1 giọt CH₃NH₂',act:'indicator'}],predict:{q:'Nếu nhỏ CH₃NH₂ lên giấy quỳ tím, giấy sẽ có màu gì?',options:['A. Màu đỏ','B. Màu xanh','C. Không đổi màu'],correct:1},observe:{q:'Dung dịch methylamine có môi trường gì?',options:['A. Acid','B. Base','C. Trung tính'],correct:1},conclude:{q:'Vì sao dung dịch methylamine có tính base?',options:['A. Vì tạo ra ion H⁺ trong nước','B. Vì CH₃NH₂ nhận H⁺ từ nước, sinh ra OH⁻','C. Vì CH₃NH₂ tạo kết tủa với nước'],correct:1},equations:['CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻'],explain:'CH₃NH₂ nhận proton từ H₂O, làm tăng nồng độ ion OH⁻. Giấy quỳ tím chuyển xanh; giấy pH đổi sang màu của môi trường base.',conclusionText:'Dung dịch methylamine có tính base.',hint:['Chọn một trong hai loại giấy chỉ thị trong tủ hóa chất.','Hãy chọn lọ CH₃NH₂ trước khi nhấn nút nhỏ giọt.']},
{id:2,short:'Phản ứng với HCl',title:'Phản ứng với dung dịch acid',objective:'Quan sát methylamine phản ứng với dung dịch HCl.',mission:'Thêm chỉ thị vào methylamine, sau đó thêm HCl từ từ.',steps:[{name:'Chuẩn bị dung dịch',detail:'Thêm 2 mL CH₃NH₂ 0,1 M',needs:['amine'],button:'Thêm 2 mL CH₃NH₂',act:'basefill'},{name:'Thêm chất chỉ thị',detail:'Nhỏ 1 giọt phenolphthalein',needs:['phenol'],button:'Nhỏ 1 giọt phenolphthalein',act:'phenol'},{name:'Thêm acid từ từ',detail:'Thêm 2 mL HCl 0,1 M',needs:['hcl'],button:'Thêm từ từ 2 mL HCl',act:'acid'}],predict:{q:'Màu hồng của phenolphthalein sẽ thay đổi thế nào khi thêm đủ HCl?',options:['A. Đậm dần','B. Nhạt dần rồi mất màu','C. Chuyển thành xanh lam'],correct:1},observe:{q:'Hiện tượng sau khi thêm đủ HCl là gì?',options:['A. Xuất hiện kết tủa','B. Màu hồng nhạt dần rồi mất màu','C. Dung dịch chuyển xanh lam'],correct:1},conclude:{q:'Phản ứng giữa CH₃NH₂ và HCl tạo thành chất nào?',options:['A. Muối CH₃NH₃Cl','B. Khí NH₃','C. Kết tủa Fe(OH)₃'],correct:0},equations:['CH₃NH₂ + HCl → CH₃NH₃Cl'],explain:'Methylamine có tính base, phản ứng với HCl tạo muối methylammonium chloride. Phenolphthalein mất màu khi dung dịch không còn đủ tính base.',conclusionText:'Methylamine phản ứng với acid tạo muối.',hint:['Trước tiên phải có dung dịch CH₃NH₂ trong ống nghiệm.','Thêm phenolphthalein để nhìn thấy sự thay đổi môi trường.','Chọn HCl và quan sát thanh lượng acid 0–2 mL.']},
{id:3,short:'Phản ứng với FeCl₃',title:'Phản ứng với dung dịch FeCl₃',objective:'Khảo sát phản ứng của methylamine với muối Fe(III).',mission:'Chuẩn bị FeCl₃, thêm methylamine rồi lắc nhẹ.',steps:[{name:'Chuẩn bị FeCl₃',detail:'Thêm 1 mL dung dịch màu vàng',needs:['fe'],button:'Thêm 1 mL FeCl₃',act:'fefill'},{name:'Thêm methylamine',detail:'Thêm từ từ 3 mL CH₃NH₂',needs:['amine'],button:'Thêm từ từ 3 mL CH₃NH₂',act:'feprecip'},{name:'Lắc nhẹ ống nghiệm',detail:'Quan sát rồi để yên',needs:[],button:'Lắc nhẹ ống nghiệm',act:'feshake'}],predict:{q:'Khi thêm CH₃NH₂ vào dung dịch FeCl₃, điều gì có thể xuất hiện?',options:['A. Kết tủa nâu đỏ','B. Kết tủa trắng','C. Khí thoát ra'],correct:0},observe:{q:'Kết tủa nâu đỏ tạo thành là chất nào?',options:['A. Fe(OH)₂','B. Fe(OH)₃','C. FeCl₃'],correct:1},conclude:{q:'Tính chất nào của methylamine được thể hiện?',options:['A. Tính acid','B. Tính base tạo kết tủa hydroxide','C. Tính oxi hóa mạnh'],correct:1},equations:['FeCl₃ + 3CH₃NH₂ + 3H₂O → Fe(OH)₃↓ + 3CH₃NH₃Cl'],explain:'Methylamine nhận proton từ nước, tạo môi trường base. Ion Fe³⁺ tạo kết tủa keo Fe(OH)₃ màu nâu đỏ. Lắc làm kết tủa phân tán, không làm kết tủa tan.',conclusionText:'CH₃NH₂ thể hiện tính base khi tác dụng với dung dịch FeCl₃.',hint:['Chuẩn bị dung dịch FeCl₃ màu vàng trước.','Chọn lọ methylamine CH₃NH₂ và thêm từ từ.','Không cần chọn thêm hóa chất khi lắc ống nghiệm.']},
{id:4,short:'Phản ứng với CuSO₄',title:'Phản ứng với CuSO₄ và Cu(OH)₂',objective:'Khảo sát phản ứng của methylamine với muối Cu(II).',mission:'Quan sát riêng giai đoạn tạo kết tủa và giai đoạn thêm amine dư.',steps:[{name:'Chuẩn bị CuSO₄',detail:'Thêm 2 mL dung dịch xanh nhạt',needs:['cu'],button:'Thêm 2 mL CuSO₄',act:'cufill'},{name:'Thêm CH₃NH₂ từ từ',detail:'Quan sát giai đoạn đầu',needs:['amine'],button:'Thêm CH₃NH₂ từ từ',act:'cuprecip'},{name:'Tiếp tục thêm đến dư',detail:'Thêm từng phần, quan sát kỹ',needs:['amine'],button:'Tiếp tục thêm CH₃NH₂ đến dư',act:'cuexcess'},{name:'Lắc đều ống nghiệm',detail:'Quan sát trạng thái cuối',needs:[],button:'Lắc đều ống nghiệm',act:'cushake'}],predict:{q:'Khi thêm CH₃NH₂ từ từ rồi đến dư vào CuSO₄, em dự đoán điều gì?',options:['A. Chỉ có kết tủa trắng','B. Ban đầu có kết tủa xanh, sau đó tạo dung dịch xanh đậm','C. Dung dịch chuyển nâu đỏ'],correct:1},checkpoint:{q:'Hãy nhìn vào ống nghiệm. Em thấy gì ở giai đoạn đầu?',options:['A. Bọt khí không màu','B. Kết tủa màu xanh lam','C. Kết tủa màu nâu đỏ'],correct:1},observe:{q:'Khi thêm methylamine đủ dư rồi lắc đều, hiện tượng nào xảy ra?',options:['A. Kết tủa không thay đổi','B. Kết tủa tan, tạo dung dịch xanh lam đậm','C. Kết tủa chuyển nâu đỏ'],correct:1},conclude:{q:'Vì sao kết tủa Cu(OH)₂ có thể tan trong methylamine dư?',options:['A. Do tạo khí H₂','B. Do tạo phức tan của Cu²⁺ với methylamine','C. Do Cu²⁺ bị khử thành Cu'],correct:1},equations:['CuSO₄ + 2CH₃NH₂ + 2H₂O → Cu(OH)₂↓ + (CH₃NH₃)₂SO₄','Cu(OH)₂ + 4CH₃NH₂ ⇌ [Cu(CH₃NH₂)₄]²⁺ + 2OH⁻'],explain:'Ban đầu methylamine thể hiện tính base, tạo Cu(OH)₂ màu xanh lam nhạt. Khi methylamine đủ dư, sự hình thành phức của Cu²⁺ với methylamine thúc đẩy kết tủa tan dần và thu được dung dịch xanh lam đậm. Phương trình tạo phức là cách biểu diễn giản lược.',conclusionText:'Methylamine có tính base và khả năng tạo phức với Cu²⁺ trong điều kiện thích hợp.',hint:['Chuẩn bị CuSO₄ màu xanh lam nhạt trước.','Dừng ở giai đoạn kết tủa và quan sát kỹ, không chuyển ngay sang phức xanh đậm.','Methylamine phải đủ dư; thao tác thêm theo từng phần, không áp đặt một thể tích nhỏ cố định.','Chỉ lắc sau khi đã thêm đủ methylamine dư.']}
];
const $=s=>document.querySelector(s);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='home',activeLab=0,openDrawer='',isZoom=false,sound=false,animId=0,sessions={},best={},timerToast=null;const blankVisual=()=>({volume:0,color:'#e6f7fc',precip:0,scatter:0,bloom:0,paper:0,agitation:0});
const freshSession=id=>({id,step:0,selected:null,paperChoice:'litmus',phase:'predict',predict:null,checkpointDone:false,checkpointWrong:-1,obs:{tries:0,wrong:-1,points:0,correct:false},conclusion:{tries:0,wrong:-1,points:0,correct:false},wrongChem:0,score:0,stepPoints:0,excessDoses:0,hcl:0,visual:blankVisual(),busy:false,replaying:false,animProgress:0,animDrops:false,animLabel:'',history:[],showHint:false,seenStages:0});
LABS.forEach(l=>sessions[l.id]=freshSession(l.id));
try{best=JSON.parse(localStorage.getItem('amine_laboratory_v2_scores')||'{}')||{}}catch(e){best={}}
const persist=()=>{try{localStorage.setItem('amine_laboratory_v2_scores',JSON.stringify(best))}catch(e){}};
const getLab=()=>LABS.find(l=>l.id===activeLab);const getSession=()=>sessions[activeLab];
function soundTone(type='tap'){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const a=window.__amineAudio||(window.__amineAudio=new AC());if(a.state==='suspended')a.resume();const osc=a.createOscillator(),vol=a.createGain(),t=a.currentTime;osc.type='sine';osc.frequency.setValueAtTime(type==='bad'?240:type==='done'?650:480,t);osc.frequency.exponentialRampToValueAtTime(type==='bad'?180:type==='done'?850:610,t+.10);vol.gain.setValueAtTime(.055,t);vol.gain.exponentialRampToValueAtTime(.0001,t+.16);osc.connect(vol);vol.connect(a.destination);osc.start(t);osc.stop(t+.18)}catch(e){}}
function notify(msg,kind='normal'){const t=$('#toast');t.textContent=msg;t.className='notice-toast show'+(kind==='bad'?' warning':kind==='good'?' success':'');clearTimeout(timerToast);timerToast=setTimeout(()=>t.classList.remove('show'),3100)}
const chemById=id=>CHEMS.find(c=>c.id===id);
function miniChem(c){if(c.paper)return `<svg viewBox="0 0 44 50" aria-hidden="true"><path d="M10 6l26 2-2 34-26-3z" fill="${c.shade}" stroke="#98adbf" stroke-width="2"/><path d="M14 12l17 1" stroke="#fff" stroke-width="2.5" opacity=".65"/>${c.id==='ph'?'<path d="M14 31l16 1" stroke="#76b874" stroke-width="3"/>':''}</svg>`;return `<svg viewBox="0 0 44 50" aria-hidden="true"><defs><linearGradient id="b${c.id}" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#d1eff4" stop-opacity=".28"/><stop offset="1" stop-color="#9fced9" stop-opacity=".4"/></linearGradient></defs><rect x="15" y="3" width="14" height="9" rx="2" fill="#688a9f"/><rect x="14" y="11" width="16" height="6" rx="2" fill="#e3f4f6" stroke="#a2c4d1"/><rect x="8" y="15" width="28" height="32" rx="7" fill="url(#b${c.id})" stroke="#88b4c5" stroke-width="1.5"/><path d="M10 29h24v11q0 5-5 5H15q-5 0-5-5z" fill="${c.shade}"/><rect x="11" y="22" width="22" height="13" rx="2" fill="#fff" stroke="#d1dde1"/><text x="22" y="30" text-anchor="middle" font-size="6.1" font-weight="900" fill="#4d6574">${safe(c.label)}</text><path d="M12 18v23" stroke="#fff" stroke-width="3" opacity=".7"/></svg>`}
function cardArt(id){const color=['','#8371ca','#e65c94','#a66b41','#2a82c8'][id];if(id===1)return `<svg viewBox="0 0 150 135" aria-hidden="true"><ellipse cx="75" cy="94" rx="58" ry="24" fill="#d9eef2" stroke="#a0c7d3" stroke-width="3"/><ellipse cx="75" cy="90" rx="52" ry="19" fill="#effcfd" stroke="#b4dae2"/><rect x="42" y="77" width="65" height="23" rx="2" fill="#8970c6" transform="rotate(-8 75 88)"/><ellipse cx="75" cy="89" rx="20" ry="10" fill="#2489d0" opacity=".7"/><path d="M75 18v51" stroke="#8bbcc9" stroke-width="10" stroke-linecap="round"/><path d="M75 69l-4 10q4 11 8 0z" fill="#b4eefb"/></svg>`;return `<svg viewBox="0 0 150 135" aria-hidden="true"><ellipse cx="75" cy="122" rx="40" ry="5" fill="#c0dce4" opacity=".65"/><path d="M50 16v82q0 28 25 28t25-28V16" fill="#e6f8fc" opacity=".65" stroke="#91bdca" stroke-width="5"/><path d="M56 82h38v18q0 21-19 21t-19-21z" fill="${id===2?'#e87db7':id===3?'#f3ce85':'#81c4ef'}"/><path d="M53 18v82q0 21 15 24" stroke="white" stroke-width="4" opacity=".8" fill="none"/>${id===3?'<g fill="#a65b38"><circle cx="66" cy="94" r="6"/><circle cx="83" cy="108" r="8"/><circle cx="73" cy="115" r="6"/></g>':''}${id===4?'<g fill="#2594d2"><ellipse cx="69" cy="100" rx="12" ry="7"/><ellipse cx="84" cy="110" rx="13" ry="9"/></g>':''}<ellipse cx="75" cy="16" rx="25" ry="5" fill="#f3fcff" stroke="#9bbfce" stroke-width="2"/></svg>`}
function heroArt(){return `<svg viewBox="0 0 390 235" aria-hidden="true"><ellipse cx="193" cy="218" rx="155" ry="14" fill="#c5e2e3" opacity=".7"/><path d="M20 200h350" stroke="#a9d4d9" stroke-width="3"/><g transform="translate(14 -2)"><path d="M62 64v108q0 37 28 37t28-37V64" fill="#f1ffff" fill-opacity=".55" stroke="#9cbeca" stroke-width="5"/><path d="M69 146h42v28q0 27-21 27t-21-27z" fill="#86c9f3"/><g fill="#459add" opacity=".9"><circle cx="83" cy="177" r="6"/><circle cx="98" cy="187" r="7"/><circle cx="84" cy="197" r="4"/></g><ellipse cx="90" cy="64" rx="28" ry="6" fill="#e9faff" stroke="#a6c9d6" stroke-width="2"/></g><g transform="translate(105 -16)"><path d="M70 75v111q0 33 31 33t31-33V75" fill="#edfbff" fill-opacity=".55" stroke="#8fb9c9" stroke-width="5"/><path d="M77 120h48v63q0 27-24 27t-24-27z" fill="#1c6cc5" opacity=".78"/><path d="M82 125v72" stroke="#fff" opacity=".5" stroke-width="4"/><ellipse cx="101" cy="75" rx="31" ry="7" fill="#f0fcff" stroke="#90becc" stroke-width="3"/></g><g transform="translate(238 10)"><path d="M23 95v65q0 36 34 36t34-36V95" fill="#f6fcff" fill-opacity=".7" stroke="#9cbdc9" stroke-width="5"/><path d="M31 147h53v14q0 28-26 28t-27-28z" fill="#bf7255" opacity=".79"/><g fill="#99533c" opacity=".95"><circle cx="42" cy="166" r="8"/><circle cx="69" cy="182" r="8"/><circle cx="58" cy="180" r="10"/></g><ellipse cx="57" cy="95" rx="34" ry="7" fill="#f0fcff" stroke="#a0c6cf" stroke-width="3"/></g><g transform="translate(228 1)"><path d="M9 38v57" stroke="#7aaaba" stroke-width="12" stroke-linecap="round"/><path d="M9 95l-5 12q5 11 10 0z" fill="#b6e9f4"/></g><g fill="#fff" opacity=".75"><circle cx="14" cy="77" r="5"/><circle cx="369" cy="99" r="5"/><circle cx="348" cy="19" r="4"/></g></svg>`}
function renderHome(){const earned=Object.values(best).reduce((sum,v)=>sum+(Number(v.score)||0),0);const count=Object.keys(best).filter(k=>best[k]&&best[k].score!==undefined).length;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">Thực hành tương tác · Hóa học 12 · Kết nối tri thức</div><h1>PHẢN ỨNG CỦA<br>NHÓM AMINE</h1><p>Tự chọn hóa chất, tiến hành từng thao tác, quan sát sự đổi màu và kết tủa, rồi trả lời để rút ra kiến thức. Mỗi thí nghiệm tối đa 25 điểm.</p><div class="hero-chips"><span class="hero-chip">◉ 4 thí nghiệm</span><span class="hero-chip">◉ 7 hóa chất & chỉ thị</span><span class="hero-chip">◉ ${count}/4 đã hoàn thành</span><span class="hero-chip">◉ ${earned}/100 điểm tốt nhất</span></div></div><div class="hero-visual">${heroArt()}</div></section><div class="section-heading"><h2>Chọn thí nghiệm để bắt đầu</h2><p>Dự đoán → Chọn hóa chất → Thao tác → Quan sát → Kết luận</p></div><div class="home-cards">${LABS.map(l=>`<button class="home-card" data-open="${l.id}"><div class="home-art"><span class="home-num">THÍ NGHIỆM ${l.id}</span>${cardArt(l.id)}</div><div class="home-card-body"><h3>${safe(l.title)}</h3><p>${safe(l.objective)}</p><div class="home-card-foot"><span class="best-badge ${best[l.id]?'done':''}">${best[l.id]?`★ ${best[l.id].score}/25 điểm`:'Chưa thực hiện'}</span><span class="open-label">Thực hiện →</span></div></div></button>`).join('')}</div><div class="home-note">Ứng dụng chạy trực tiếp trong trình duyệt, không cần Internet hay đăng nhập. Các hình ảnh phản ứng là mô phỏng định tính, không thay thế phép đo hóa học thực tế.</div>`}
function cabinetHtml(l,s){const needs=s.phase==='doing'&&s.step<l.steps.length?l.steps[s.step].needs:[];return `<div class="panel side-panel left-panel ${openDrawer==='cabinet'?'drawer-open':''}" id="cabinetPanel"><button class="drawer-close" data-close-drawer>✕ Đóng</button><h2>🧪 Tủ hóa chất</h2><p class="panel-small">Chạm vào chai hoặc giấy chỉ thị để chọn.</p><div class="cabinet-grid">${CHEMS.map(c=>{const allowed=needs.includes(c.id);const selected=s.selected===c.id;return `<button class="chemical ${selected?'selected':allowed?'highlight':'dim'}" data-chem="${c.id}" aria-label="Chọn ${safe(c.name)}" aria-pressed="${selected}">${miniChem(c)}<span><span class="chem-title">${safe(c.label)}</span><span class="chem-meta">${safe(c.detail)}</span></span></button>`}).join('')}</div><div class="cabinet-bottom"><strong>Chuẩn bị:</strong> Ống nghiệm, giá đỡ, mặt kính đồng hồ, ống nhỏ giọt và dụng cụ đong xuất hiện khi phù hợp với bài. Cu(OH)₂ <strong>không có sẵn</strong> trong tủ.</div></div>`}
function progressValue(l,s){return Math.round(100*s.step/l.steps.length)}
function stepper(l,s){return `<div class="mission-progress"><span>Tiến độ thao tác</span><strong>${s.step}/${l.steps.length} bước</strong></div><div class="progress-track"><div class="progress-fill" style="width:${progressValue(l,s)}%"></div></div><ol class="steps">${l.steps.map((st,i)=>{let state=i<s.step?'passed':i===s.step?'current':'';return `<li class="step ${state}"><span class="step-number">${i<s.step?'✓':i+1}</span><span class="step-text"><strong>${safe(st.name)}</strong><small>${safe(st.detail)}</small></span></li>`}).join('')}</ol>`}
function questionBlock(stage,l,s){if(stage==='predict')return qChoices('Dự đoán trước thí nghiệm',l.predict,'predict',s.predict,null,'Em hãy dự đoán, chưa chấm đúng/sai.');if(stage==='checkpoint')return qChoices('Dừng lại quan sát',l.checkpoint,'checkpoint',null,s.checkpointWrong,'Trả lời đúng để mở thao tác tiếp theo.');if(stage==='observe')return qChoices('Nhận xét hiện tượng · 10 điểm',l.observe,'observe',null,s.obs.wrong,'Quan sát kỹ trước khi chọn. Có thể xem lại hiện tượng.');if(stage==='conclude')return qChoices('Rút ra kết luận · 5 điểm',l.conclude,'conclude',null,s.conclusion.wrong,'Chọn kết luận phù hợp với hiện tượng vừa quan sát.');if(stage==='completed')return `<div class="result-panel"><h3>✓ Hoàn thành thí nghiệm</h3><div class="score-burst">${s.score}/25 điểm</div><div>Thao tác: ${s.stepPoints}/10 · Quan sát: ${s.obs.points}/10 · Kết luận: ${s.conclusion.points}/5.</div><div class="pred-reflect">Dự đoán ban đầu: <strong>${s.predict===l.predict.correct?'Phù hợp với kết quả':'Chưa phù hợp; em đã kiểm chứng qua thí nghiệm'}</strong>.</div><strong>Giải thích & phương trình</strong>${l.equations.map((e,i)=>`<div class="equation">${l.equations.length>1?`Giai đoạn ${i+1}<br>`:''}${safe(e)}</div>`).join('')}<div>${safe(l.explain)}</div><p><strong>Kết luận:</strong> ${safe(l.conclusionText)}</p></div>`;return `<div class="quiz-note">${s.replaying?'Đang phát lại diễn biến thí nghiệm…':'Hãy thực hiện lần lượt các thao tác, rồi trả lời câu hỏi.'}</div>`}
function qChoices(title,q,kind,chosen,wrong,note){const keys=['A','B','C'];return `<div class="quiz-head">${title}</div><p class="question-text">${safe(q.q)}</p><div class="choices">${q.options.map((opt,i)=>`<button class="choice-btn ${wrong===i?'wrong':''} ${chosen===i?'correct':''}" data-answer="${kind}" data-index="${i}"><b>${keys[i]}</b><span>${safe(opt.replace(/^[ABC]\.\s*/,''))}</span></button>`).join('')}</div><p class="quiz-note ${wrong!==null&&wrong>=0?'error':''}">${safe(note)}</p>`}
function rightHtml(l,s){const done=s.phase==='completed';return `<div class="panel side-panel right-panel ${openDrawer==='mission'?'drawer-open':''}" id="missionPanel"><button class="drawer-close" data-close-drawer>✕ Đóng</button><h2>📋 Bảng nhiệm vụ</h2><p class="panel-small">Làm lần lượt theo các bước bên dưới.</p><div class="mission-title">THÍ NGHIỆM ${l.id}</div><div class="mission-goal">${safe(l.mission)}</div>${stepper(l,s)}<div class="mission-divider"></div><div class="desktop-quiz" id="desktopQuiz">${questionBlock(s.phase,l,s)}</div>${s.predict!==null&&s.phase!=='predict'?`<div class="side-foot"><strong>☑ Đã lưu dự đoán.</strong> ${!done?'Kết quả chỉ được giải thích sau khi hoàn thành.':'Đối chiếu ở phần kết luận.'}</div>`:''}<button class="hint-btn" data-cmd="hint">💡 ${s.showHint?'Ẩn gợi ý':'Gợi ý thao tác'}</button>${s.showHint?`<div class="hint-txt">${safe(l.hint[Math.min(s.step,l.hint.length-1)])}</div>`:''}</div>`}
function controlsHtml(l,s){const st=l.steps[s.step],doing=s.phase==='doing'&&!s.busy&&!s.replaying;let head='Em hãy hoàn thành câu hỏi dự đoán trước khi thao tác.';if(s.busy)head=`Đang thực hiện thao tác… ${safe(s.animLabel)}`;else if(s.replaying)head='Đang xem lại hiện tượng; không tính thêm điểm.';else if(s.phase==='checkpoint')head='Dừng lại quan sát và trả lời câu hỏi về giai đoạn đầu.';else if(s.phase==='observe')head='Đã hoàn thành thao tác. Trả lời câu hỏi quan sát.';else if(s.phase==='conclude')head='Nhận xét chính xác! Hãy chọn kết luận.';else if(s.phase==='completed')head='Đã hoàn thành. Em có thể làm lại để cải thiện điểm.';else if(st){head=st.needs.length?`Bước ${s.step+1}: Chọn ${st.needs.map(id=>chemById(id).label).join(' hoặc ')} ở tủ hóa chất.`:`Bước ${s.step+1}: Lắc nhẹ ống nghiệm để quan sát.`}
 const ready=doing&&(st.needs.length===0||st.needs.includes(s.selected));const label=st&&s.phase==='doing'?(l.id===4&&s.step===2&&s.excessDoses===1?'Thêm tiếp phần CH₃NH₂ dư':st.button):'Tiếp tục quan sát';
 return `<div class="stage-controls"><div class="control-title">${safe(head)}</div><div class="control-line">${st&&s.phase==='doing'?`<button class="primary-btn" data-cmd="perform" ${ready?'':'disabled'}>${ready?'▶ '+safe(label):'◉ '+safe(label)}</button>`:''}${s.phase==='completed'?`<button class="primary-btn" data-cmd="next">${l.id===4?'▤ Xem bảng điểm':'Tiếp tục thí nghiệm '+(l.id+1)+' →'}</button>`:''}<button class="outline-btn" data-cmd="replay" ${s.busy||s.replaying||s.history.length===0?'disabled':''}>↻ Quan sát lại</button><button class="outline-btn" data-cmd="reset">↺ Làm lại</button><button class="outline-btn" data-cmd="zoom">${isZoom?'⤡ Thu nhỏ':'⤢ Phóng to'}</button></div><div class="tool-help">${s.selected?'Đã chọn: '+safe(chemById(s.selected).label)+' · Hãy nhấn thao tác ở trên.':s.phase==='doing'&&st&&st.needs.length?'Sau khi chọn hóa chất, nút thao tác sẽ được mở.':'Mỗi thao tác được thực hiện khi em chủ động nhấn nút.'}</div>${s.phase==='completed'?`<div class="result-inline"><strong>✓ ${s.score}/25 điểm.</strong> ${safe(l.conclusionText)}</div>`:''}</div>`}
function renderLab(){const l=getLab(),s=getSession();$('#app').innerHTML=`<section class="lab-header"><div><button class="back" data-global="home">← Trở về 4 thí nghiệm</button><h1>Thí nghiệm ${l.id}. ${safe(l.title)}</h1><p>${safe(l.objective)}</p></div><div class="lab-pills"><span class="lab-pill">Bước ${Math.min(s.step+1,l.steps.length)}/${l.steps.length}</span><span class="lab-pill gold">Tối đa 25 điểm</span></div></section><div class="lab-tabs">${LABS.map(x=>`<button class="lab-tab ${l.id===x.id?'active':''} ${best[x.id]?'done':''}" data-open="${x.id}"><span>${x.id}. ${safe(x.short)}</span></button>`).join('')}</div><div class="workflow"><strong>Hướng dẫn:</strong> <span>Dự đoán</span><span class="workflow-arrow">→</span><span>Chọn hóa chất</span><span class="workflow-arrow">→</span><span>Thực hiện</span><span class="workflow-arrow">→</span><span>Quan sát</span><span class="workflow-arrow">→</span><span>Trả lời</span></div><div class="mobile-top"><button data-drawer="cabinet">🧪 Mở tủ hóa chất</button><button data-drawer="mission">📋 Bảng nhiệm vụ</button></div><div class="lab-layout">${cabinetHtml(l,s)}<section class="stage-card ${isZoom?'zoomed':''}" id="stageCard"><div class="stage-head"><h2>⚗️ Bàn thí nghiệm</h2><span class="live-flag"><span class="live-dot"></span> MÔ PHỎNG TƯƠNG TÁC</span></div><div class="stage-art" id="visualStage"></div><div class="stage-bar"><span class="stage-info" id="visualCaption">Hãy chọn hóa chất và thao tác.</span><button class="small-btn" data-cmd="zoom">${isZoom?'Thu nhỏ':'⤢ Phóng to'}</button></div>${l.id===2?`<div class="stage-meter"><div class="meter-top"><span>Lượng HCl đã thêm</span><strong id="hclLabel">0,0 / 2,0 mL</strong></div><div class="meter-track"><div class="meter-fill" id="hclMeter"></div></div></div>`:''}${controlsHtml(l,s)}</section>${rightHtml(l,s)}</div><div class="mobile-quiz" id="mobileQuiz">${questionBlock(s.phase,l,s)}</div>`;
  renderScene();updateShade();}
function scoreRating(earned){return earned>=90?'Hoàn thành xuất sắc':earned>=70?'Hoàn thành tốt':earned>=50?'Cần luyện tập thêm':'Hãy thực hiện lại và quan sát kỹ hơn'}
function renderSummary(){const earned=LABS.reduce((a,l)=>a+(best[l.id]?.score||0),0),count=LABS.filter(l=>best[l.id]).length;$('#app').innerHTML=`<section class="summary-hero"><div><div class="eyebrow">Kết quả học tập · Hóa học 12</div><h1>BẢNG TỔNG HỢP ĐIỂM</h1><p><strong>${count}/4 thí nghiệm đã hoàn thành</strong>. ${count===4?scoreRating(earned):'Tiếp tục thực hiện các thí nghiệm còn lại để có kết quả đầy đủ.'}</p><p>Hệ thống lấy điểm tốt nhất của mỗi thí nghiệm; dự đoán ban đầu không bị trừ điểm.</p></div><div class="score-circle" style="--pct:${earned}"><div class="score-circle-core"><strong>${earned}</strong><span>/100 ĐIỂM</span></div></div></section><section class="summary-card"><h2>Chi tiết kết quả từng thí nghiệm</h2><table class="score-table"><thead><tr><th>Thí nghiệm</th><th class="right">Thao tác /10</th><th class="right">Hiện tượng /10</th><th class="right">Kết luận /5</th><th class="right">Tổng /25</th></tr></thead><tbody>${LABS.map(l=>{const r=best[l.id];return `<tr><td><strong>${l.id}. ${safe(l.title)}</strong></td><td class="right">${r?r.steps:'—'}</td><td class="right">${r?r.obs:'—'}</td><td class="right">${r?r.conclusion:'—'}</td><td class="right"><strong>${r?r.score+'/25':'Chưa làm'}</strong></td></tr>`}).join('')}<tr class="total-row"><td>TỔNG KẾT</td><td class="right">/40</td><td class="right">/40</td><td class="right">/20</td><td class="right">${earned}/100</td></tr></tbody></table><div class="summary-actions"><button class="primary-btn" data-global="home">← Danh sách thí nghiệm</button><button class="outline-btn" data-global="print">⎙ In / lưu PDF</button><button class="outline-btn" data-global="clear">↺ Làm lại toàn bộ và xóa điểm</button></div><div class="summary-small">Thang đánh giá: 90–100 điểm: Hoàn thành xuất sắc; 70–89: Hoàn thành tốt; 50–69: Cần luyện tập thêm; dưới 50: Hãy thực hiện lại và quan sát kỹ hơn.<br>Điểm được lưu cục bộ trên trình duyệt của thiết bị này nếu trình duyệt cho phép. Có thể chụp ảnh bảng kết quả để gửi giáo viên.</div></section>`}
function render(){if(view==='home')renderHome();else if(view==='summary')renderSummary();else renderLab();$('#soundButton').textContent=sound?'♫ Tắt âm thanh':'♫ Bật âm thanh'}
function navigateLab(id){cancelAnimation();activeLab=Number(id);view='lab';isZoom=false;openDrawer='';render();window.scrollTo({top:0,behavior:'instant'})}
function navigateHome(){cancelAnimation();view='home';activeLab=0;isZoom=false;openDrawer='';render();window.scrollTo({top:0,behavior:'instant'})}
function navigateSummary(){cancelAnimation();view='summary';activeLab=0;isZoom=false;openDrawer='';render();window.scrollTo({top:0,behavior:'instant'})}
function updateShade(){const el=$('#shade');if(el)el.classList.toggle('active',!!openDrawer)}
function toggleDrawer(d){openDrawer=openDrawer===d?'':d;$('#cabinetPanel')?.classList.toggle('drawer-open',openDrawer==='cabinet');$('#missionPanel')?.classList.toggle('drawer-open',openDrawer==='mission');updateShade()}
function selectChem(id){if(view!=='lab')return;const l=getLab(),s=getSession();if(s.busy||s.replaying||s.phase==='completed')return;if(s.phase==='predict'){notify('Hãy dự đoán hiện tượng trước khi chọn hóa chất.');return}if(s.phase==='checkpoint'||s.phase==='observe'||s.phase==='conclude'){notify('Hãy trả lời câu hỏi quan sát trước khi thao tác tiếp.');return}const st=l.steps[s.step];if(!st||!st.needs.length){notify('Bước này chỉ cần lắc ống nghiệm, không thêm hóa chất.');return}if(!st.needs.includes(id)){s.wrongChem++;s.selected=null;soundTone('bad');notify('Hóa chất chưa phù hợp. Em hãy xem lại nhiệm vụ.', 'bad')}else{s.selected=id;soundTone();notify('Đã chọn '+chemById(id).label+'. Hãy nhấn nút thực hiện.','good')}openDrawer='';renderLab()}
function wrongAnswer(s,kind,i){const data=s[kind==='observe'?'obs':'conclusion'];data.tries++;data.wrong=i;soundTone('bad');notify('Em hãy quan sát lại hiện tượng và thử lần nữa.','bad');renderLab()}
function answer(kind,i){if(view!=='lab')return;const s=getSession(),l=getLab();if(s.busy||s.replaying||s.phase==='completed'||s.phase!==kind)return;
if(kind==='predict'){s.predict=i;s.phase='doing';s.selected=null;soundTone();notify('Đã lưu dự đoán. Chưa công bố đáp án. Hãy làm thí nghiệm.','good');renderLab();return}
if(kind==='checkpoint'){if(i!==l.checkpoint.correct){s.checkpointWrong=i;soundTone('bad');notify('Hãy nhìn kỹ lại ống nghiệm và thử lần nữa.','bad');renderLab();return}s.checkpointDone=true;s.checkpointWrong=-1;s.phase='doing';s.selected=null;soundTone();notify('Chính xác! Em có thể tiếp tục thêm methylamine đến dư.','good');renderLab();return}
const data=s[kind==='observe'?'obs':'conclusion'],q=l[kind==='observe'?'observe':'conclude'];if(i!==q.correct){wrongAnswer(s,kind,i);return}data.tries++;data.correct=true;data.wrong=-1;data.points=kind==='observe'?(data.tries===1?10:data.tries===2?8:6):(data.tries===1?5:data.tries===2?4:3);if(kind==='observe'){s.phase='conclude';soundTone('tap');notify('Chính xác! Em đã quan sát đúng hiện tượng.','good');renderLab();return}
s.stepPoints=Math.max(0,10-2*s.wrongChem);s.score=s.stepPoints+s.obs.points+s.conclusion.points;s.phase='completed';s.selected=null;const previous=best[l.id];if(!previous||s.score>previous.score){best[l.id]={score:s.score,steps:s.stepPoints,obs:s.obs.points,conclusion:s.conclusion.points,date:Date.now()};persist()}soundTone('done');notify('Hoàn thành thí nghiệm '+l.id+': '+s.score+'/25 điểm!','good');renderLab()}
const mix=(a,b,t)=>{const parse=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));let A=parse(a),B=parse(b);return '#'+A.map((c,i)=>Math.round(c+(B[i]-c)*t).toString(16).padStart(2,'0')).join('')};
const interpolate=(a,b,t)=>({volume:a.volume+(b.volume-a.volume)*t,color:mix(a.color,b.color,t),precip:a.precip+(b.precip-a.precip)*t,scatter:a.scatter+(b.scatter-a.scatter)*t,bloom:a.bloom+(b.bloom-a.bloom)*t,paper:a.paper+(b.paper-a.paper)*t,agitation:a.agitation+(b.agitation-a.agitation)*t});
const sleep=t=>new Promise(r=>setTimeout(r,t));
const clone=v=>({...v});
function cancelAnimation(){animId++;Object.values(sessions).forEach(s=>{const old=s.replayBackup||s.operationBackup;if(old){s.visual=clone(old.visual);s.hcl=old.hcl;s.selected=old.selected;if(old.phase)s.phase=old.phase;}s.operationBackup=null;s.replayBackup=null;if(s.busy||s.replaying){s.busy=false;s.replaying=false;s.animDrops=false;s.animProgress=0;s.animLabel=''}})}
function planForStep(l,s,st){const v=clone(s.visual),end=clone(v);let dur=2150,drops=true,label='Đang thêm hóa chất',hcl=s.hcl,shaking=false;switch(st.act){
case 'paper':end.paper=1;dur=620;drops=false;label='Đặt giấy lên mặt kính';break;
case 'indicator':end.bloom=1;dur=2450;label='Nhỏ 1 giọt methylamine';break;
case 'basefill':end.volume=2;end.color='#dceff7';dur=1900;label='Đong 2 mL methylamine';break;
case 'phenol':end.color='#ee66a7';dur=2200;label='Nhỏ chỉ thị phenolphthalein';break;
case 'acid':end.volume=4;end.color='#dcf5fa';dur=3800;hcl=2;label='Thêm HCl từ từ';break;
case 'fefill':end.volume=1;end.color='#f1c447';dur=1850;label='Đong 1 mL FeCl₃';break;
case 'feprecip':end.volume=4;end.color='#e5c2a1';end.precip=1;dur=2900;label='Thêm methylamine vào FeCl₃';break;
case 'feshake':end.scatter=0;end.agitation=0;dur=3000;drops=false;shaking=true;label='Lắc rồi để yên';break;
case 'cufill':end.volume=2;end.color='#a9dcf1';dur=1900;label='Thêm dung dịch CuSO₄';break;
case 'cuprecip':end.volume=6;end.precip=1;end.color='#a3d9eb';dur=3000;label='Thêm từ từ methylamine';break;
case 'cuexcess':{const first=s.excessDoses===0;end.volume=first?11:16;end.precip=first?.70:.30;end.color=first?'#6bb9ed':'#3777d1';dur=first?2750:2900;label=first?'Thêm methylamine dư – phần 1':'Thêm methylamine dư – phần 2';break}
case 'cushake':end.precip=0;end.color='#134dbc';end.scatter=0;end.agitation=0;dur=3400;drops=false;shaking=true;label='Lắc nhẹ và quan sát';break}
return {from:v,end,dur,drops,label,hclFrom:s.hcl,hclEnd:hcl,shaking,act:st.act}}
async function animate(s,plan,token,replay=false){const start=performance.now();s.busy=!replay;s.animDrops=plan.drops;s.animLabel=plan.label;s.animProgress=0;const startHcl=plan.hclFrom??s.hcl,endHcl=plan.hclEnd??startHcl;return new Promise(resolve=>{let last=0;function frame(t){if(token!==animId||view!=='lab'||activeLab!==s.id){s.busy=false;s.animDrops=false;resolve(false);return}const linear=Math.min(1,(t-start)/plan.dur),smooth=linear*linear*(3-2*linear);s.visual=interpolate(plan.from,plan.end,smooth);if(plan.shaking){const shakiness=Math.sin(Math.PI*linear);s.visual.agitation=.95*shakiness;s.visual.scatter=shakiness*.88;}s.hcl=startHcl+(endHcl-startHcl)*linear;s.animProgress=linear;if(t-last>26||linear===1){last=t;renderScene()}if(linear<1){requestAnimationFrame(frame)}else{s.visual=clone(plan.end);s.hcl=endHcl;s.busy=false;s.animDrops=false;s.animProgress=0;renderScene();resolve(true)}}requestAnimationFrame(frame)})}
async function perform(){if(view!=='lab')return;const l=getLab(),s=getSession();if(s.phase!=='doing'||s.busy||s.replaying)return;const st=l.steps[s.step];if(!st)return;if(st.needs.length&&!st.needs.includes(s.selected)){notify('Em hãy chọn đúng hóa chất trong tủ trước khi thực hiện.','bad');return}
if(st.act==='paper')s.paperChoice=s.selected;
const plan=planForStep(l,s,st),token=++animId;s.operationBackup={visual:clone(s.visual),hcl:s.hcl,selected:s.selected,phase:s.phase};s.busy=true;renderLab();const done=await animate(s,plan,token);if(!done)return;s.operationBackup=null;s.history.push({...plan,from:clone(plan.from),end:clone(plan.end)});
if(st.act==='cuexcess'){s.excessDoses++;if(s.excessDoses<2){s.selected='amine';soundTone();renderLab();notify('Đã thêm một phần dung dịch. Hãy chủ động thêm phần tiếp theo.');return}}
s.step++;s.selected=null;s.seenStages=s.step;
if(l.id===4&&st.act==='cuprecip'){s.phase='checkpoint'}else if(s.step===l.steps.length){s.phase='observe'}else{s.phase='doing'}
soundTone(s.phase==='observe'?'done':'tap');renderLab();notify(s.phase==='checkpoint'?'Dừng lại! Hãy quan sát kết tủa trước khi tiếp tục.':s.phase==='observe'?'Đã hoàn thành thao tác. Hãy trả lời câu hỏi quan sát.':'Chính xác! Hãy thực hiện bước tiếp theo.','good')}
async function replay(){if(view!=='lab')return;const s=getSession();if(s.busy||s.replaying||!s.history.length)return;const lastVisual=clone(s.visual),lastHcl=s.hcl,oldPhase=s.phase,oldSelected=s.selected,token=++animId;s.replayBackup={visual:clone(lastVisual),hcl:lastHcl,selected:oldSelected,phase:oldPhase};s.replaying=true;s.selected=null;s.visual=blankVisual();s.hcl=0;renderLab();let good=true;for(const p of s.history){if(token!==animId){good=false;break}s.visual=clone(p.from);s.hcl=p.hclFrom;let replayPlan={...p,dur:Math.min(p.dur,3050)};const ok=await animate(s,replayPlan,token,true);if(!ok){good=false;break}if(p.act==='cuprecip')await sleep(900)}if(!good||token!==animId)return;s.visual=lastVisual;s.hcl=lastHcl;s.phase=oldPhase;s.selected=oldSelected;s.replaying=false;s.replayBackup=null;s.animLabel='';renderLab();notify('Đã quan sát lại; câu trả lời và điểm không thay đổi.','good')}
function currentCaption(l,s){if(s.replaying)return '⏵ Đang phát lại diễn biến của các thao tác đã thực hiện.';if(s.busy)return '● '+s.animLabel+'… Quan sát diễn biến trong mô hình.';if(s.phase==='predict')return 'Dự đoán trước khi tiến hành thí nghiệm.';if(s.phase==='checkpoint')return 'Tạm dừng ở giai đoạn đầu. Hãy quan sát thật kỹ.';if(s.phase==='observe'||s.phase==='conclude')return 'Hãy nhìn vào hiện tượng và trả lời câu hỏi.';if(s.phase==='completed')return '✓ Đã hoàn thành. Có thể quan sát lại hoặc xem kết luận.';return s.selected?'Đã chọn '+chemById(s.selected).label+'. Sẵn sàng thao tác.':'Chọn hóa chất trong tủ bên trái để bắt đầu.'}
// Kết cấu dụng cụ và hiệu ứng được dựng thuần SVG, không cần ảnh hoặc thư viện ngoài.
function sceneDefs(){return `<defs>
<linearGradient id="lab-wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafc"/><stop offset="1" stop-color="#dceef2"/></linearGradient>

<linearGradient id="waterGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".24"/><stop offset=".2" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#143e66" stop-opacity=".12"/><stop offset="1" stop-color="#16394f" stop-opacity=".2"/></linearGradient>
<linearGradient id="glassPaper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7fcff" stop-opacity=".86"/><stop offset="1" stop-color="#b7dce8" stop-opacity=".50"/></linearGradient>
<clipPath id="tubeInside"><path d="M306 119V379Q306 432 361 432Q416 432 416 379V119Z"/></clipPath>

</defs>`}
function stageBackdrop(){return `<rect x="0" y="0" width="720" height="490" rx="15" fill="url(#lab-wall)"/><path d="M0 351h720v139H0z" fill="url(#lab-bench)"/><path d="M0 352h720" stroke="#c3dbe2" stroke-width="4"/><path d="M26 69h150" stroke="#accdd6" stroke-width="6" stroke-linecap="round" opacity=".6"/><path d="M41 76v91h120V76" fill="#e7f3f5" opacity=".38"/><g opacity=".44"><path d="M534 52h143v173H534z" fill="#f9fdff" stroke="#c2dae2" stroke-width="3"/><path d="M603 52v173M534 141h143" stroke="#c2dae2" stroke-width="3"/><path d="M546 66l118 140" stroke="#fff" stroke-width="4" opacity=".8"/></g><ellipse cx="360" cy="453" rx="187" ry="16" fill="#8fb6c5" opacity=".18"/><rect x="12" y="12" width="138" height="27" rx="13" fill="#ffffffc9"/><text x="81" y="30" text-anchor="middle" fill="#608a99" font-size="12" font-weight="800">BÀN THỰC HÀNH</text>`}
function selectedBottle(s){if(!s.selected)return `<rect x="518" y="328" width="151" height="67" rx="12" fill="#f0f8f9" stroke="#bed8e0" stroke-dasharray="5 5"/><text x="592" y="353" text-anchor="middle" font-size="12" fill="#82a4b0">Khay dụng cụ</text><text x="592" y="371" text-anchor="middle" font-size="11" fill="#9db2b9">Chưa chọn hóa chất</text>`;const c=chemById(s.selected);return `<rect x="520" y="327" width="149" height="76" rx="12" fill="#f4fbfa" stroke="#b4dcdf"/><g transform="translate(542 333) scale(1.14)">${miniChem(c)}</g><text x="605" y="356" text-anchor="middle" font-size="11" fill="#3e7180" font-weight="850">ĐÃ CHỌN</text><text x="610" y="377" text-anchor="middle" font-size="13" fill="#145774" font-weight="900">${safe(c.label)}</text>`}
const deterministic=(n)=>((Math.sin(n*85.153+7.236)*9827.223)%1+1)%1;
function makePrecip(s,top){const v=s.visual;if(v.precip<.01)return '';const copper=s.id===4;const base=copper?'#76c8e7':'#a15a37',deep=copper?'#3ba6d5':'#8a4e31';let html='';const num=Math.round(82*v.precip);for(let i=0;i<num;i++){const x=315+deterministic(i+13)*92;const ySpan=419-top-6;const r=3.0+deterministic(i+15)*5.8;let y=top+8+deterministic(i+19)*Math.max(18,ySpan);const settle=1-v.scatter;const bandTop=399-(40*v.precip);y=y*(1-settle*.72)+Math.max(top+12,bandTop+deterministic(i+23)*24)*settle*.72;y=Math.min(423,Math.max(top+7,y));const opa=(.46+.42*deterministic(i+41))*Math.min(1,v.precip*1.2);html+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*.82).toFixed(1)}" fill="${i%3?base:deep}" opacity="${opa.toFixed(2)}"/>`}
for(let j=0;j<11;j++){const x=318+j*8.8+deterministic(j+100)*6,y=Math.max(top+22,383-v.scatter*42)+deterministic(j+125)*24;html+=`<ellipse cx="${x}" cy="${y}" rx="${(10+deterministic(j+7)*6)*v.precip}" ry="${(6+deterministic(j+9)*5)*v.precip}" fill="${base}" opacity="${.24*v.precip}" filter="url(#flocSoft)"/>`}
return html}
function animatedDrops(s,onPaper=false){if(!s.animDrops||s.animProgress===0)return '';let parts='';for(let i=0;i<4;i++){const d=(s.animProgress*5-i*.24);if(d<0)continue;const t=d%1;if(t<.92){const yy=(onPaper?194:69)+Math.pow(t,1.5)*(onPaper?74:79);const rr=4.5+t*2.2;parts+=`<path d="M361 ${yy-rr*2}Q${361+rr} ${yy-rr*.2} ${361+rr*.58} ${yy+rr*.5}Q361 ${yy+rr*1.8} ${361-rr*.58} ${yy+rr*.5}Q${361-rr} ${yy-rr*.2} 361 ${yy-rr*2}Z" fill="#a3e3f6" stroke="#67b7d0" stroke-width=".5" opacity=".88"/>`}}
return onPaper?`<g><rect x="350" y="128" width="22" height="70" rx="10" fill="#d7f8ff" stroke="#8bbac9" stroke-width="3"/><path d="M361 193v5" stroke="#95b8cb" stroke-width="5" stroke-linecap="round"/>${parts}</g>`:`<g><rect x="350" y="-10" width="22" height="74" rx="10" fill="#d7f8ff" stroke="#8bbac9" stroke-width="3"/><path d="M361 63v7" stroke="#95b8cb" stroke-width="5" stroke-linecap="round"/><ellipse cx="361" cy="-10" rx="13" ry="6" fill="#367e9d"/>${parts}</g>`}
function tubeSvg(s){const v=s.visual,filled=v.volume>0.03,liquidTop=filled?Math.round(405-(.15+Math.min(.8,v.volume/19*.7))*300):430;const shakeAngle=(v.agitation||0)*Math.sin(s.animProgress*50)*7;const cloud=makePrecip(s,liquidTop);return `<g filter="url(#dropShadow)"><rect x="221" y="257" width="284" height="14" rx="7" fill="#a9bcc4"/><rect x="227" y="268" width="17" height="134" rx="7" fill="#9ab0b9"/><rect x="479" y="268" width="17" height="134" rx="7" fill="#9ab0b9"/><rect x="210" y="397" width="304" height="18" rx="9" fill="#a7bac3"/><path d="M236 313h256" stroke="#b5c8ce" stroke-width="11"/></g><g transform="rotate(${shakeAngle.toFixed(1)} 361 299)"><path d="M299 119V378Q299 440 361 440Q423 440 423 378V119Z" fill="url(#glassBody)" opacity=".9"/><g clip-path="url(#tubeInside)">${filled?`<rect x="305" y="${liquidTop}" width="112" height="${437-liquidTop}" fill="${v.color}" opacity=".91"/><rect x="305" y="${liquidTop}" width="112" height="${437-liquidTop}" fill="url(#waterGlow)"/><ellipse cx="361" cy="${liquidTop+3}" rx="55" ry="6" fill="${mix(v.color,'#ecfeff',.44)}" opacity=".62"/><path d="M308 ${liquidTop+3}Q336 ${liquidTop-2+v.agitation*7} 362 ${liquidTop+2}T415 ${liquidTop+1}" fill="none" stroke="#f1ffff" stroke-width="2.4" opacity=".72"/>${cloud}`:''}</g><path d="M299 119V378Q299 440 361 440Q423 440 423 378V119" fill="none" stroke="#91bfce" stroke-width="7"/><path d="M309 137v242q0 35 24 45" fill="none" stroke="#fff" opacity=".74" stroke-width="5" stroke-linecap="round"/><path d="M413 137v241q0 32-19 44" fill="none" stroke="#fff" opacity=".43" stroke-width="3" stroke-linecap="round"/><ellipse cx="361" cy="119" rx="62" ry="11" fill="#eafaff" stroke="#8eb9c8" stroke-width="3"/><ellipse cx="361" cy="120" rx="51" ry="5.5" fill="#f8ffff" opacity=".92"/></g>${animatedDrops(s)}<text x="361" y="468" fill="#638b9a" text-anchor="middle" font-weight="800" font-size="12">ỐNG NGHIỆM THỦY TINH</text><path d="M274 190h-52" stroke="#9ebec9" stroke-width="1.8" stroke-dasharray="4 4"/><text x="212" y="185" text-anchor="end" font-weight="800" fill="#628797" font-size="12">Quan sát</text><text x="212" y="202" text-anchor="end" fill="#8aa1ab" font-size="11">màu sắc, chất rắn</text>`}
function watchSvg(s){const v=s.visual,hasPaper=v.paper>.08,c=s.paperChoice==='ph'?'#e4c05c':'#8b70c7',changed=s.paperChoice==='ph'?'#4261b8':'#2d8fcb',bloom=v.bloom;return `<ellipse cx="354" cy="375" rx="188" ry="32" fill="#aac9d3" opacity=".17"/><ellipse cx="359" cy="303" rx="207" ry="76" fill="url(#glassPaper)" opacity=".85" stroke="#91c4d1" stroke-width="5"/><ellipse cx="359" cy="298" rx="187" ry="65" fill="#f3fcff" opacity=".58" stroke="#b0dce6" stroke-width="3"/><ellipse cx="355" cy="298" rx="162" ry="53" fill="none" stroke="white" stroke-width="5" opacity=".75"/>${hasPaper?`<g transform="rotate(-8 360 286)" opacity="${Math.min(1,v.paper)}"><rect x="252" y="256" width="193" height="63" rx="4" fill="#bdcdd7" opacity=".28" transform="translate(3 6)"/><rect x="252" y="256" width="193" height="63" rx="4" fill="${c}" stroke="#afbac9" stroke-width="2"/><path d="M257 264h183" stroke="white" stroke-opacity=".3" stroke-width="5"/>${bloom>0?`<g clip-path="url(#indicatorClip)"><ellipse cx="350" cy="288" rx="${6+bloom*122}" ry="${5+bloom*48}" fill="${changed}" opacity="${.95*bloom}"/><ellipse cx="350" cy="288" rx="${6+bloom*65}" ry="${3+bloom*28}" fill="${changed}" opacity="${.5*bloom}"/></g>`:''}</g>`:`<text x="359" y="300" text-anchor="middle" font-size="17" fill="#82a8b7" font-weight="750">Chọn giấy chỉ thị</text>`}${animatedDrops(s,true)}<text x="359" y="425" fill="#6c8c9c" font-size="13" font-weight="800" text-anchor="middle">MẶT KÍNH ĐỒNG HỒ</text>`}
function renderScene(){if(view!=='lab')return;const l=getLab(),s=getSession(),target=$('#visualStage');if(!target)return;target.innerHTML=`<svg viewBox="0 0 720 490" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mô hình động của thí nghiệm ${l.id}">${sceneDefs()}${stageBackdrop()}${l.id===1?watchSvg(s):tubeSvg(s)}${selectedBottle(s)}</svg>`;const cap=$('#visualCaption');if(cap)cap.textContent=currentCaption(l,s);if(l.id===2){const hcl=$('#hclLabel'),meter=$('#hclMeter');if(hcl)hcl.textContent=s.hcl.toFixed(1).replace('.',',')+' / 2,0 mL';if(meter)meter.style.width=(s.hcl/2*100)+'%'}}
function resetOne(){if(view!=='lab')return;const l=getLab();cancelAnimation();sessions[l.id]=freshSession(l.id);openDrawer='';renderLab();notify('Đã đưa thí nghiệm về trạng thái ban đầu. Điểm tốt nhất đã lưu vẫn được giữ lại.','good')}
function cmd(c){if(c==='perform'){perform();return}if(c==='reset'){resetOne();return}if(c==='replay'){replay();return}if(c==='zoom'){isZoom=!isZoom;const card=$('#stageCard');card?.classList.toggle('zoomed',isZoom);const bs=document.querySelectorAll('[data-cmd="zoom"]');bs.forEach(b=>b.textContent=isZoom?'⤡ Thu nhỏ':'⤢ Phóng to');return}if(c==='next'){const s=getSession();if(s.phase==='completed'){if(s.id===4)navigateSummary();else navigateLab(s.id+1)}return}if(c==='hint'){const s=getSession();s.showHint=!s.showHint;renderLab();return}}
function globalCmd(c){if(c==='fullscreen'){if(document.fullscreenElement){document.exitFullscreen?.()}else{const enter=document.documentElement.requestFullscreen;if(typeof enter==='function'){Promise.resolve(enter.call(document.documentElement)).catch(()=>notify('Trình duyệt không cho phép chế độ toàn màn hình.'))}else notify('Chế độ toàn màn hình không được hỗ trợ.')}return}if(c==='home')navigateHome();if(c==='summary')navigateSummary();if(c==='sound'){sound=!sound;$('#soundButton').textContent=sound?'♫ Tắt âm thanh':'♫ Bật âm thanh';soundTone();notify(sound?'Đã bật âm thanh.':'Đã tắt âm thanh.')}if(c==='print')window.print();if(c==='clear'&&confirm('Xóa toàn bộ điểm đã lưu và thực hiện lại từ đầu?')){cancelAnimation();best={};persist();LABS.forEach(l=>sessions[l.id]=freshSession(l.id));navigateHome();notify('Đã làm lại toàn bộ và xóa điểm đã lưu.','good')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.closest('[data-close-drawer]'))toggleDrawer('');return}if(b.hasAttribute('data-close-drawer')){toggleDrawer('');return}if(b.dataset.open)navigateLab(b.dataset.open);else if(b.dataset.global)globalCmd(b.dataset.global);else if(b.dataset.drawer)toggleDrawer(b.dataset.drawer);else if(b.dataset.chem)selectChem(b.dataset.chem);else if(b.dataset.answer)answer(b.dataset.answer,Number(b.dataset.index));else if(b.dataset.cmd)cmd(b.dataset.cmd)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(openDrawer){toggleDrawer('');return}if(isZoom){isZoom=false;$('#stageCard')?.classList.remove('zoomed');document.querySelectorAll('[data-cmd="zoom"]').forEach(b=>b.textContent='⤢ Phóng to')}}});
render();
})();
